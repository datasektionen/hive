openapi: 3.1.0

# see: https://spec.openapis.org/oas/v3.1.0.html
# schemas: https://json-schema.org/understanding-json-schema/reference/type

info:
  title: Hive API
  summary: Centralized groups and permissions management.
  description: |
    Hive's API allows arbitrary services to easily defer authorization to a
    centralized single source of truth. Systems can in this way benefit from
    powerful group management flexibility without implementing the underlying
    logic themselves, since the supporting complexity is transparently handled
    by Hive when services request relevant information.

    API version 1 is the first primary edition of HTTP REST endpoints exposed by
    Hive (except for version 0, which should not be used by new code). This is
    currently the preferred way of interfacing and integrating with Hive for
    authorized systems and all changes within this version will always be
    backwards compatible.

    All values returned by all endpoints are always in JSON format.

    ## Results Relevant to Consumer System
    All operations are relative to the invoker, as determined by the system
    associated with the API key passed via the HTTP `Authorization` header (see
    below). This means that anywhere a system ID is not passed, the current
    "relevant" one is used.

    ## Overriding Consumer System
    In rare cases, certain API tokens may be authorized to invoke this API's
    endpoints on behalf of other systems with which they are not directly
    associated (for example, a login system forwarding information relevant to
    its clients as a convenience, or a gateway mediating requests to Hive). To
    achieve this, consumers may include the `X-Hive-Impersonate-System` HTTP
    header set to the target system ID, indicating that Hive should override the
    consumer to that system and all results will then be relevant to it (and not
    the system associated with the invoking API token as normal). Note that this
    will only be accepted if the invoking API token has a matching
    `$hive:api-impersonate-system:<other-system-id>` permission, otherwise a
    `403 Forbidden` HTTP status will be returned.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Central server

security:
  - bearer: []

tags:
  - name: users
    description: Endpoints related to user permissions
  - name: tokens
    description: Endpoints related to API token permissions
  - name: tagged
    description: Endpoints related to tagged entities
  - name: group
    description: Endpoints related to groups

# if ever adding a new endpoint, consider using badges:
# ```yaml
# /some-path:
#   get:
#     x-badges:
#       - label: Beta
#         color: blue
# ```
paths:
  /user/{username}/permissions:
    get:
      operationId: user_permissions
      summary: List a user's permissions for the relevant system
      description: |
        Returns an array with the user's recognized permissions for the system
        relevant to the API consumer (per authentication).

        The returned array never contains any duplicates and its entries are
        ordered lexicographically by permission ID and then scope.
      tags: [users]
      parameters:
        - name: username
          in: path
          description: The username associated with the target user
          required: true
          schema:
            $ref: "#/components/schemas/Username"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            The user's permissions for the specified system.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: "#/components/schemas/PermId"
                    scope:
                      oneOf:
                        - description: Scope
                          $ref: "#/components/schemas/PermScope"
                        - description: Unscoped
                          type: "null"
                  required:
                    - id
                    - scope
                  additionalProperties: false
              examples:
                some:
                  summary: Some permissions
                  value:
                    - id: attest
                      scope: "*"
                    - id: view-logs
                      scope: null
                    - id: write
                      scope: /central/flag.txt
                none:
                  summary: No permissions
                  value: []
        default:
          $ref: "#/components/responses/UnknownError"
  /user/{username}/permission/{perm_id}:
    get:
      operationId: user_has_permission
      summary: Check whether a user has a given permission
      description: |
        Returns a boolean corresponding to whether the user is recognized to
        have the given permission for the system relevant to the API consumer
        (per authentication).

        If the specified permission is scoped, this endpoint always returns
        false, unless the user is authorized for the wildcard scope (`*`).
      tags: [users]
      parameters:
        - name: username
          in: path
          description: The username associated with the target user
          required: true
          schema:
            $ref: "#/components/schemas/Username"
        - name: perm_id
          in: path
          description: The permission to check for
          required: true
          schema:
            $ref: "#/components/schemas/PermId"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            Whether the user is recognized to have the specified authorization.
          content:
            application/json:
              schema:
                type: boolean
              examples:
                yes:
                  summary: Authorized
                  value: true
                no:
                  summary: Not authorized
                  value: false
        default:
          $ref: "#/components/responses/UnknownError"
  /user/{username}/permission/{perm_id}/scopes:
    get:
      operationId: user_permission_scopes
      summary: List a user's authorized scopes for a given permission
      description: |
        Returns an array with the user's recognized scopes for the given
        permission (in the system relevant to the API consumer, per
        authentication).

        The returned array never contains any duplicates and its entries are
        ordered lexicographically.

        If the specified permission is not scoped, this endpoint always returns
        an empty array.
      tags: [users]
      parameters:
        - name: username
          in: path
          description: The username associated with the target user
          required: true
          schema:
            $ref: "#/components/schemas/Username"
        - name: perm_id
          in: path
          description: The permission to list scopes for
          required: true
          schema:
            $ref: "#/components/schemas/PermId"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            The user's recognized scopes for the specified permission.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermScope"
              examples:
                some:
                  summary: Some assigned scopes
                  value:
                    - "*"
                    - /central/flag.txt
                none:
                  summary: Unscoped permission or no assigned scopes
                  value: []
        default:
          $ref: "#/components/responses/UnknownError"
  /user/{username}/permission/{perm_id}/scope/{scope}:
    get:
      operationId: user_has_permission_scoped
      summary: Check whether a user has a given permission scope
      description: |
        Returns a boolean corresponding to whether the user is recognized to
        have the given permission with the specified scope (or the wildcard
        scope `*`) for the system relevant to the API consumer (per
        authentication).

        If the specified permission is not scoped, this endpoint always returns
        false.
      tags: [users]
      parameters:
        - name: username
          in: path
          description: The username associated with the target user
          required: true
          schema:
            $ref: "#/components/schemas/Username"
        - name: perm_id
          in: path
          description: The permission to check for
          required: true
          schema:
            $ref: "#/components/schemas/PermId"
        - name: scope
          in: path
          description: The permission scope to check for
          required: true
          schema:
            $ref: "#/components/schemas/PermScope"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            Whether the user is recognized to have the specified authorization.
          content:
            application/json:
              schema:
                type: boolean
              examples:
                yes:
                  summary: Authorized
                  value: true
                no:
                  summary: Not authorized
                  value: false
        default:
          $ref: "#/components/responses/UnknownError"
  /token/{secret}/permissions:
    get:
      operationId: token_permissions
      summary: List an API token's permissions for the relevant system
      description: |
        Returns an array with the token's recognized permissions for the system
        relevant to the API consumer (per authentication).

        The returned array never contains any duplicates and its entries are
        ordered lexicographically by permission ID and then scope.
      tags: [tokens]
      parameters:
        - name: secret
          in: path
          description: The API token secret associated with the target token
          required: true
          schema:
            $ref: "#/components/schemas/TokenSecret"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            The API token's permissions for the specified system.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      $ref: "#/components/schemas/PermId"
                    scope:
                      oneOf:
                        - description: Scope
                          $ref: "#/components/schemas/PermScope"
                        - description: Unscoped
                          type: "null"
                  required:
                    - id
                    - scope
                  additionalProperties: false
              examples:
                some:
                  summary: Some permissions
                  value:
                    - id: attest
                      scope: "*"
                    - id: view-logs
                      scope: null
                    - id: write
                      scope: /central/flag.txt
                none:
                  summary: No permissions
                  value: []
        default:
          $ref: "#/components/responses/UnknownError"
  /token/{secret}/permission/{perm_id}:
    get:
      operationId: token_has_permission
      summary: Check whether an API token has a given permission
      description: |
        Returns a boolean corresponding to whether the token is recognized to
        have the given permission for the system relevant to the API consumer
        (per authentication).

        If the specified permission is scoped, this endpoint always returns
        false, unless the token is authorized for the wildcard scope (`*`).
      tags: [tokens]
      parameters:
        - name: secret
          in: path
          description: The API token secret associated with the target token
          required: true
          schema:
            $ref: "#/components/schemas/TokenSecret"
        - name: perm_id
          in: path
          description: The permission to check for
          required: true
          schema:
            $ref: "#/components/schemas/PermId"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            Whether the API token is recognized to have the specified
            authorization.
          content:
            application/json:
              schema:
                type: boolean
              examples:
                yes:
                  summary: Authorized
                  value: true
                no:
                  summary: Not authorized
                  value: false
        default:
          $ref: "#/components/responses/UnknownError"
  /token/{secret}/permission/{perm_id}/scopes:
    get:
      operationId: token_permission_scopes
      summary: List an API token's authorized scopes for a given permission
      description: |
        Returns an array with the token's recognized scopes for the given
        permission (in the system relevant to the API consumer, per
        authentication).

        The returned array never contains any duplicates and its entries are
        ordered lexicographically.

        If the specified permission is not scoped, this endpoint always returns
        an empty array.
      tags: [tokens]
      parameters:
        - name: secret
          in: path
          description: The API token secret associated with the target token
          required: true
          schema:
            $ref: "#/components/schemas/TokenSecret"
        - name: perm_id
          in: path
          description: The permission to list scopes for
          required: true
          schema:
            $ref: "#/components/schemas/PermId"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            The API token's recognized scopes for the specified permission.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermScope"
              examples:
                some:
                  summary: Some assigned scopes
                  value:
                    - "*"
                    - /central/flag.txt
                none:
                  summary: Unscoped permission or no assigned scopes
                  value: []
        default:
          $ref: "#/components/responses/UnknownError"
  /token/{secret}/permission/{perm_id}/scope/{scope}:
    get:
      operationId: token_has_permission_scoped
      summary: Check whether an API token has a given permission scope
      description: |
        Returns a boolean corresponding to whether the token is recognized to
        have the given permission with the specified scope (or the wildcard
        scope `*`) for the system relevant to the API consumer (per
        authentication).

        If the specified permission is not scoped, this endpoint always returns
        false.
      tags: [tokens]
      parameters:
        - name: secret
          in: path
          description: The API token secret associated with the target token
          required: true
          schema:
            $ref: "#/components/schemas/TokenSecret"
        - name: perm_id
          in: path
          description: The permission to check for
          required: true
          schema:
            $ref: "#/components/schemas/PermId"
        - name: scope
          in: path
          description: The permission scope to check for
          required: true
          schema:
            $ref: "#/components/schemas/PermScope"
      security:
        - bearer: [$hive:api-check-permissions]
      responses:
        "200":
          description: |
            Whether the API token is recognized to have the specified
            authorization.
          content:
            application/json:
              schema:
                type: boolean
              examples:
                yes:
                  summary: Authorized
                  value: true
                no:
                  summary: Not authorized
                  value: false
        default:
          $ref: "#/components/responses/UnknownError"
  /tagged/{tag_id}/groups:
    get:
      operationId: tagged_groups
      summary: List all groups with a given tag
      description: |
        Returns an array with all Hive groups recognized to have been tagged
        (directly or indirectly) with the specified tag in the system relevant
        to the API consumer (per authentication).

        The returned array never contains any duplicates and its entries are
        ordered lexicographically by group name, then group domain, then group
        ID, and finally by tag content. The group name included for each entry
        is provided localized for the language specified via the query parameter
        `lang`, or otherwise in Swedish if no preference is given.

        If the specified tag does not support being assigned to groups, this
        endpoint always returns an empty array. If the tag supports content,
        the respective value is included for each entry; otherwise, it is `null`
        for every entry.
      tags: [tagged]
      parameters:
        - name: tag_id
          in: path
          description: The tag to list groups for
          required: true
          schema:
            $ref: "#/components/schemas/TagId"
        - name: lang
          in: query
          description: Language to display group name in
          required: false
          schema:
            type: string
            enum: [en, sv]
            default: sv
        - name: description
          in: query
          description: If the response should include the group description
          required: false
          schema:
            type: boolean
            default: false
      security:
        - bearer: [$hive:api-list-tagged]
      responses:
        "200":
          description: The groups tagged with the specified tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaggedGroup"
        default:
          $ref: "#/components/responses/UnknownError"
  /tagged/{tag_id}/memberships/{username}:
    get:
      operationId: tagged_user_memberships
      summary: List all of a user's groups with a given tag
      description: |
        Returns an array with all of a user's Hive groups recognized to have
        been tagged (directly or indirectly) with the specified tag in the
        system relevant to the API consumer (per authentication).

        Only groups of which the specified user is a member (direct or indirect)
        are included in the resulting list. This does *not* include tags
        assigned directly to the user, even if supported by the tag.

        The returned array never contains any duplicates and its entries are
        ordered lexicographically by group name, then group domain, then group
        ID, and finally by tag content. The group name included for each entry
        is provided localized for the language specified via the query parameter
        `lang`, or otherwise in Swedish if no preference is given.

        If the specified tag does not support being assigned to groups, this
        endpoint always returns an empty array. If the tag supports content,
        the respective value is included for each entry; otherwise, it is `null`
        for every entry.
      tags: [tagged]
      parameters:
        - name: tag_id
          in: path
          description: The tag to list groups for
          required: true
          schema:
            $ref: "#/components/schemas/TagId"
        - name: username
          in: path
          description: The username associated with the target user
          required: true
          schema:
            $ref: "#/components/schemas/Username"
        - name: lang
          in: query
          description: Language to display group name in
          required: false
          schema:
            type: string
            enum: [en, sv]
            default: sv
        - name: description
          in: query
          description: If the response should include the group description
          required: false
          schema:
            type: boolean
            default: false
      security:
        - bearer: [$hive:api-list-tagged]
      responses:
        "200":
          $ref: "#/components/responses/TaggedGroups"
          description: |
            The user's groups tagged with the specified tag.
        default:
          $ref: "#/components/responses/UnknownError"
  /tagged/{tag_id}/users:
    get:
      operationId: tagged_users
      summary: List all users with a given tag
      description: |
        Returns an array with all Hive users recognized to have been tagged
        (directly or indirectly) with the specified tag in the system relevant
        to the API consumer (per authentication).

        The returned array never contains any duplicates and its entries are
        ordered lexicographically by username, then tag content.

        If the specified tag does not support being assigned to users, this
        endpoint always returns an empty array. If the tag supports content,
        the respective value is included for each entry; otherwise, it is `null`
        for every entry.
      tags: [tagged]
      parameters:
        - name: tag_id
          in: path
          description: The tag to list users for
          required: true
          schema:
            $ref: "#/components/schemas/TagId"
      security:
        - bearer: [$hive:api-list-tagged]
      responses:
        "200":
          description: |
            The users tagged with the specified tag.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      description: User's username
                      $ref: "#/components/schemas/Username"
                    tag_content:
                      description: Assigned tag content
                      oneOf:
                        - description: Tag with content
                          type: string
                          minLength: 1
                        - description: Tag without content
                          type: "null"
                  required:
                    - username
                    - tag_content
              examples:
                some-with-content:
                  summary: Tag with content
                  value:
                    - username: rmfseo
                      tag_content: green
                    - username: hwals
                      tag_content: black
                some-no-content:
                  summary: Tag with no content
                  value:
                    - username: bwidman
                      tag_content: null
                none:
                  summary: No users with tag
                  value: []
        default:
          $ref: "#/components/responses/UnknownError"
  /group/{group_domain}/{group_id}/members:
    get:
      operationId: tagged_group_members
      summary: List all members in a given group
      description: |
        Returns an array with the usernames of all the users recognized to be
        (direct or indirect) members of a given group.

        The group must be tagged (directly or indirectly) with at least one tag
        associated with the system relevant to the API consumer (per
        authentication), otherwise an error will be returned.

        The returned array never contains any duplicates and its entries are
        ordered lexicographically.
      tags: [group]
      parameters:
        - name: group_id
          in: path
          description: The ID of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: group_domain
          in: path
          description: The domain of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupDomain"
      security:
        - bearer: [$hive:api-list-tagged]
      responses:
        "200":
          description: |
            The users who are members of the specified group.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Username"
              examples:
                some:
                  summary: Group with members
                  value:
                    - rmfseo
                    - bwidman
                none:
                  summary: Group without members
                  value: []
        default:
          $ref: "#/components/responses/UnknownError"
    post:
      operationId: add_tagged_member
      summary: Add a new member to a tagged group
      description: |
        Adds a new member to the group and returns all the info on the new 
        assignment.

        The group must be tagged (directly or indirectly) with at least one tag
        associated with the system relevant to the API consumer (per
        authentication), otherwise an error will be returned.
      tags: [group]
      parameters:
        - name: group_id
          in: path
          description: The ID of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: group_domain
          in: path
          description: The domain of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupDomain"
      requestBody:
        description: The information about the new member
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberDto"
      security:
        - bearer: [$hive:manage-members]
      responses:
        "200":
          description: |
            Detailed info about the member that was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedMember"
        default:
          $ref: "#/components/responses/UnknownError"
  /group/{group_domain}/{group_id}/members/details:
    get:
      operationId: tagged_group_members_detailed
      summary: List detailed information about all members in a given group
      description: |
        Returns an array with detailed information (id, form, until, manager) for all 
        the users recognized to be (direct or indirect) members of a given group.

        The group must be tagged (directly or indirectly) with at least one tag
        associated with the system relevant to the API consumer (per
        authentication), otherwise an error will be returned.

        The returned array never contains any duplicates and its entries are
        ordered by the id.
      tags: [group]
      parameters:
        - name: group_id
          in: path
          description: The ID of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: group_domain
          in: path
          description: The domain of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupDomain"
      security:
        - bearer: [$hive:api-list-tagged]
      responses:
        "200":
          description: |
            A list of detailed information about all group members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DetailedMember"
        default:
          $ref: "#/components/responses/UnknownError"
  /group/{group_domain}/{group_id}/members/{membership_id}:
    delete:
      operationId: delete_tagged_member
      summary: Removes a direct member from a group
      description: |
        Removes a member from a group based on their direct membership id. 

        The group must be tagged (directly or indirectly) with at least one tag
        associated with the system relevant to the API consumer (per
        authentication), otherwise an error will be returned.

        The endpoint doesn't return any body on success, only a status code.
      tags: [group]
      parameters:
        - name: group_id
          in: path
          description: The ID of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: group_domain
          in: path
          description: The domain of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupDomain"
        - name: membership_id
          in: path
          description: The direct membership id of the user
          required: true
          schema:
            type: string
            format: uuid
      security:
        - bearer: [$hive:manage-members]
      responses:
        "200":
          description: Member removed successfully
        default:
          $ref: "#/components/responses/UnknownError"
  /group/{group_domain}/{group_id}/tag/{tag_id}:
    get:
      operationId: tagged_group_content
      summary: List the content of every instance of a tag in a given group
      description: |
        Returns an array with the content of all of the specified tag id.

        The group must be tagged (directly or indirectly) with at least one tag
        associated with the system relevant to the API consumer (per
        authentication), otherwise an error will be returned.

        The returned array never contains any duplicates and its entries are
        ordered lexicographically.
      tags: [group]
      parameters:
        - name: group_id
          in: path
          description: The ID of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: group_domain
          in: path
          description: The domain of the group to list members for
          required: true
          schema:
            $ref: "#/components/schemas/GroupDomain"
        - name: tag_id
          in: path
          description: The tag to get the content of
          required: true
          schema:
            $ref: "#/components/schemas/TagId"
      security:
        - bearer: [$hive:api-list-tagged]
      responses:
        "200":
          description: |
            The content of all tags with the specified id on the specified group
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                some:
                  summary: Tag with content
                  value:
                    - turetek@kth.se
                    - diadat@kth.se
                none:
                  summary: Tag without content
                  value: []
        default:
          $ref: "#/components/responses/UnknownError"
  /group/{group_domain}/{group_id}/tag:
    post:
      operationId: add_tagged_group_content
      summary: Add a new tag with content to a group
      description: |
        Adds a new tag to the group and returns the assigned tag.

        The group must be tagged (directly or indirectly) with at least one tag
        associated with the system relevant to the API consumer (per
        authentication), otherwise an error will be returned.
      tags: [group]
      parameters:
        - name: group_id
          in: path
          description: The ID of the group to add a tag to
          required: true
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: group_domain
          in: path
          description: The domain of the group to add a tag to
          required: true
          schema:
            $ref: "#/components/schemas/GroupDomain"
      requestBody:
        description: The tag to be assigned
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTagWithApiDto"
      security:
        - bearer: [$hive:assign-tags]
      responses:
        "200":
          description: |
            Info about the assigned tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaggedGroup"
        default:
          $ref: "#/components/responses/UnknownError"
  /group/{group_domain}/{group_id}/tag/{tag_id}/content/{content}:
    delete:
      operationId: delete_tagged_group_content
      summary: Removes an assigned tag from a group
      description: |
        Removes a tag from a group based on their content. 

        The group must be tagged (directly or indirectly) with at least one tag
        associated with the system relevant to the API consumer (per
        authentication), otherwise an error will be returned.

        The endpoint doesn't return any body on success, only a status code.
      tags: [group]
      parameters:
        - name: group_id
          in: path
          description: The ID of the group to remove a tag from
          required: true
          schema:
            $ref: "#/components/schemas/GroupId"
        - name: group_domain
          in: path
          description: The domain of the group to remove a tag from
          required: true
          schema:
            $ref: "#/components/schemas/GroupDomain"
        - name: tag_id
          in: path
          description: The name of the tag to remove
          required: true
          schema:
            $ref: "#/components/schemas/TagId"
        - name: content
          in: path
          description: The content of the tag to remove
          required: true
          schema:
            type: string
            minLength: 1
      security:
        - bearer: [$hive:manage-tags]
      responses:
        "200":
          description: Tag removed successfully
        default:
          $ref: "#/components/responses/UnknownError"

components:
  securitySchemes:
    bearer:
      description: |
        All endpoints require the API consumer (i.e., the service making the
        request) to authenticate themselves by specifying a valid **API token
        secret** (in UUID format) via the HTTP Bearer scheme. The corresponding
        API token must have one or more `$hive:api-*` permissions assigned to it
        through Hive. Different endpoints may require different permissions.

        This means that all requests must have an HTTP `Authorization` header in
        the format `Bearer <secret>`, where `<secret>` is the secret for a
        registered API token with appropriate `$hive:api-*` permissions. For
        example, a valid header value is
        `Bearer dac5d8a9-5ffc-4972-ad6c-4428e18ece49`.

        The system with which the API token is associated will be used to
        provide relevant, personalized results wherever they would be relative
        to a given system, which means that the system ID is provided
        implicitly by means of this authentication mechanism and so does not
        have to be explicitly specified anywhere else.
      type: http
      scheme: bearer
      bearerFormat: uuid
  schemas:
    Username:
      description: Username
      type: string
      pattern: "^[a-z0-9]{2,}$"
      examples:
        - rmfseo
        - 12g
    TokenSecret:
      description: API Token Secret
      type: string
      format: uuid
      examples:
        - a1225570-4076-4e36-8f84-37eb5a33d6ac
    PermId:
      description: Permission ID
      type: string
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      examples:
        - attest
        - create-posts
    PermScope:
      description: Permission Scope
      type: string
      minLength: 1
      examples:
        - "*"
        - /central/flag.txt
    TagId:
      description: Tag ID
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      examples:
        - author-pseudonym
        - discord-role
    GroupId:
      description: Group ID
      type: string
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      examples:
        - d-sys
        - sn
    GroupDomain:
      description: Group Domain
      type: string
      pattern: ^[-a-z0-9]+\.[a-z]+$
      examples:
        - example.com
        - hive.internal
    AddMemberDto:
      description: Info to add a new member
      type: object
      properties:
        username:
          description: The username associated with the user 
          type: string
          minLength: 1
        manager:
          description: If the user is a manager for the group
          type: boolean
        from:
          description: The date the membership starts
          type: string
          format: date
        until:
          description: The date the membership ends
          type: string
          format: date
      examples:
        basic:
          summary: Direct member of group
          value:
            - username: turetek
              manager: false
              from: 2000-01-01
              until: 2001-01-01
    AssignTagWithApiDto:
      type: object
      properties:
        tag:
          description: The tag to assign
          type: string
          minLength: 1
        content:
          description: The content of the tag to assign
          type: string
          minLength: 1
      required: ["tag"]
      examples:
        without-content:
          summary: Direct member of group
          value:
            - tag: internal
        with-content:
          summary: Direct member of group
          value:
            - tag: email
              content: turetek@kth.se
    DetailedMember:
      type: object
      properties:
        id:
          description: The users membership id
          type: ["string", "null"]
          format: uuid
        username:
          description: The username associated with the user 
          type: string
          minLength: 1
        manager:
          description: If the user is a manager for the group
          type: bool
        from:
          description: The date the membership starts
          type: string
          format: date
        until:
          description: The date the membership ends
          type: string
          format: date
      examples:
        with-id:
          summary: Direct member of group
          value:
            - id: a1225570-4076-4e36-8f84-37eb5a33d6ac
              username: turetek
              manager: false
              from: 2000-01-01
              until: 2001-01-01
        without-id:
          summary: Indirect member of group
          value:
            - id: null
              username: turetek
              manager: false
              from: 2000-01-01
              until: 2001-01-01
    TaggedGroup:
      type: object
      properties:
        group_name:
          description: Group name in specified language
          type: string
          minLength: 1
        group_description:
          description: Group description in specified language
          type: string
          minLength: 1
        group_id:
          $ref: "#/components/schemas/GroupId"
        group_domain:
          $ref: "#/components/schemas/GroupDomain"
          description: Group domain
        tag_content:
          description: Assigned tag content
          oneOf:
            - description: Tag with content
              type: string
              minLength: 1
            - description: Tag without content
              type: "null"
      required:
        - group_name
        - group_id
        - group_domain
        - tag_content
      examples:
        some-with-content:
          summary: Tag with content
          value:
            - group_name: Systemansvarig
              group_id: d-sys
              group_domain: example.com
              tag_content: D-Sys
            - group_name: Internationella Nämnden
              group_id: in
              group_domain: example.com
              tag_content: Int. Nämnden
        some-no-content:
          summary: Tag with no content
          value:
            - group_name: Kassör
              group_id: kassor
              group_domain: example.com
              tag_content: null
            - group_name: International Committee Leadership
              group_id: int
              group_domain: example.com
              tag_content: null
        some-with-content-and-description:
          summary: Tag with content and description
          value:
            - group_name: Systemansvarig
              group_description: Ansvarig för utveckling och drift av sektionens system. Leder systemgruppen.
              group_id: d-sys
              group_domain: example.com
              tag_content: D-Sys
            - group_name: Internationella Nämnden
              group_description: Ansvarig för alla internationella aktiviteter på Datasektionen och är delad med Sektionen för Medieteknik.
              group_id: in
              group_domain: example.com
              tag_content: Int. Nämnden
        none:
          summary: No groups with tag
          value: []
  responses:
    UnknownError:
      description: Generic API error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                const: true
              info:
                description: Error information
                type: object
                properties:
                  key:
                    description: Identifier for the kind of error in question
                    type: string
                    pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)*$"
                    examples:
                      - api-key.unknown
                  details:
                    description: Optional additional context
                    type: object
                    minProperties: 1
                    patternProperties:
                      "^[a-z0-9]+(_[a-z0-9]+)*$": {}
                    additionalProperties: false
                    examples:
                      - id: 59afd669-388a-4489-be4c-342dddb970ee
                required:
                  - key
            required:
              - error
              - info
            additionalProperties: false
          examples:
            with-details:
              summary: Sample error with details
              value:
                error: true
                info:
                  key: api-key.unknown
                  details:
                    id: 59afd669-388a-4489-be4c-342dddb970ee
            without-details:
              summary: Sample error without details
              value:
                error: true
                info:
                  key: forbidden
